plugins { id 'com.android.application' }

def buildNumber = (project.findProperty('verCode') ?: '1').toInteger()

android {
    namespace 'com.waziralsaaeat.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.waziralsaaeat.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField 'String', 'SITE_URL', '"https://waziralsaaeat.com/"'
    }
    // مفتاح توقيع ثابت: بيخلي كل نسخة جديدة تتثبت فوق القديمة من غير ما تمسح التطبيق
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
