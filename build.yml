name: Build APK
on: { push: {}, workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        run: |
          D=$(dirname "$(find . -name settings.gradle | head -1)")
          cd "$D" && gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: waziralsaaeat-apk, path: "**/app-debug.apk" }
      - name: Publish release (للتحديث التلقائي داخل التطبيق)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -name app-debug.apk | head -1)
          gh release create "v${{ github.run_number }}" "$APK" --title "v${{ github.run_number }}" --notes "Auto build ${{ github.run_number }}"
